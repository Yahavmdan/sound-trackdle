<div class="player d-flex flex-column align-items-center w-100">
  <div class="play-toggle my-2"
       role="button"
       tabindex="0"
       [class.playing]="isAudioPlaying()"
       [attr.aria-label]="isAudioPlaying() ? 'Pause' : 'Play'"
       (click)="isAudioPlaying() ? pause(progressBar) : play(progressBar)"
       (keyup.enter)="isAudioPlaying() ? pause(progressBar) : play(progressBar)">
    <span *ngIf="!isAudioPlaying()" class="play-btn"></span>
    <span *ngIf="isAudioPlaying()" class="pause-btn"></span>
  </div>

  <div class="d-flex w-100 align-items-center gap-2 px-1">
    <div class="vol-range-container">
      <i (click)="mute()"
         class="icon bi f-24 text-light-blue"
         [ngClass]="audio.muted ? 'bi-volume-mute-fill' : 'bi-volume-down-fill'">
      </i>
      <input class="vol-range" type="range" min="0" max="1" step="0.01" (input)="changeVolume($event)"/>
    </div>

    <div class="counter-line flex-grow-1">
      <div class="unlocked-line" [style.width.%]="unlockedPercent()"></div>
      <div #progressBar class="progress-line"></div>
      <span *ngFor="let mark of marks" class="marker" [style.left.%]="mark / maxSeconds * 100"></span>
      <input class="seek" type="range" min="0" step="0.1"
             aria-label="Seek"
             [max]="limitSeconds()"
             [value]="elapsed"
             [style.width.%]="unlockedPercent()"
             (input)="seek($event, progressBar)"/>
    </div>

    <span class="time f-12 text-nowrap">{{ elapsed | number:'1.0-0' }}s / {{ limitSeconds() }}s</span>
  </div>
</div>
